  <title id="title">GDG on Campus UAM ML Contest · MiniRocket + MLP in Numba</title>
  <desc id="description">Illustrative pipeline: four time-series channels are cleaned, turned into 253 MiniRocket features and classified by a 128-unit MLP distilled from an InceptionTime teacher. Signals and scores are conceptual, not measured outputs.</desc>
