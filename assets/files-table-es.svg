    <rect x="1" y="1" width="898" height="42" fill="#2668c2"/>
    <rect x="1" y="43" width="898" height="58" fill="#244264"/><rect x="1" y="101" width="898" height="58" fill="#1c3657"/><rect x="1" y="159" width="898" height="58" fill="#244264"/><rect x="1" y="217" width="898" height="58" fill="#1c3657"/><rect x="1" y="275" width="898" height="58" fill="#244264"/>
