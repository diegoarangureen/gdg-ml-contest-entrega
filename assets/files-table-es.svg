    <text x="25" y="28" fill="#fff" font-size="13" font-weight="700" letter-spacing="1.2">FICHERO</text>
    <text x="494" y="28" fill="#fff" font-size="13" font-weight="700" letter-spacing="1.2">FUNCIÓN</text>
    <text x="25" y="70" fill="#e5f3ff" font-size="17" font-weight="700">model.py</text><text x="25" y="92" fill="#a8bfdc" font-size="13">Punto de entrada que carga el harness</text><text x="494" y="71" fill="#fff" font-size="18" font-weight="700">class Model</text><text x="494" y="93" fill="#b9d3ec" font-size="13">Carga los pesos; predict(x) → clase 0–7</text><text x="25" y="128" fill="#e5f3ff" font-size="17" font-weight="700">motor_multi.py</text><text x="25" y="150" fill="#a8bfdc" font-size="13">Motor de inferencia en Numba</text><text x="494" y="129" fill="#fff" font-size="18" font-weight="700">Limpieza · MiniRocket · MLP</text><text x="494" y="151" fill="#b9d3ec" font-size="13">Una sola llamada compilada por muestra</text><text x="25" y="186" fill="#e5f3ff" font-size="17" font-weight="700">modelo_numba.npz</text><text x="25" y="208" fill="#a8bfdc" font-size="13">Pesos entrenados (151 KB)</text><text x="494" y="187" fill="#fff" font-size="18" font-weight="700">253 → 128 → 8</text><text x="494" y="209" fill="#b9d3ec" font-size="13">Se carga con ruta relativa a model.py</text><text x="25" y="244" fill="#e5f3ff" font-size="17" font-weight="700">requirements.txt</text><text x="25" y="266" fill="#a8bfdc" font-size="13">Dependencias de inferencia</text><text x="494" y="245" fill="#fff" font-size="18" font-weight="700">numpy · numba</text><text x="494" y="267" fill="#b9d3ec" font-size="13">Sin PyTorch al predecir</text><text x="25" y="302" fill="#e5f3ff" font-size="17" font-weight="700">verificar_entrega_colab.ipynb</text><text x="25" y="324" fill="#a8bfdc" font-size="13">Comprobación en Colab, con salidas</text><text x="494" y="303" fill="#fff" font-size="18" font-weight="700">Harness · 3 ejecuciones</text><text x="494" y="325" fill="#b9d3ec" font-size="13">test_demo, latencia y score estimado</text>
