<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Results table</title>
  <desc id="desc">Official test_demo: 330 of 400 correct, 82.5 percent accuracy and 3.488 score, identical in 3 runs. Colab CPU: 0.140 ms mean latency over 3 runs, about 428,000 answers per 60 s and an estimated score of about 120. Offline teacher: InceptionTime ensemble, 89.0 percent on test_demo.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#327cda"/><stop offset="1" stop-color="#1f5dae"/></linearGradient>
    <clipPath id="outer"><rect x="1" y="1" width="898" height="228" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#outer)">
    <rect width="900" height="230" fill="#172c49"/>
    <rect x="1" y="1" width="898" height="42" fill="#2668c2"/>
    <rect x="1" y="43" width="898" height="62" fill="#244264"/><rect x="1" y="105" width="898" height="62" fill="#1c3657"/><rect x="1" y="167" width="898" height="62" fill="#244264"/>
    <path d="M560 1V229M1 43H899M1 105H899M1 167H899" stroke="#7194b8" stroke-width="1" opacity=".55"/>
  </g>
  <rect x="1" y="1" width="898" height="228" rx="12" fill="none" stroke="#6f9fd0" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="25" y="28" fill="#fff" font-size="13" font-weight="700" letter-spacing="1.2">EVALUATION</text>
    <text x="584" y="28" fill="#fff" font-size="13" font-weight="700" letter-spacing="1.2">RESULT</text>
    <text x="25" y="70" fill="#e5f3ff" font-size="17" font-weight="700">Official test_demo.npz</text><text x="25" y="92" fill="#a8bfdc" font-size="13">400 distinct samples · 3 harness runs</text><text x="584" y="71" fill="#fff" font-size="18" font-weight="700">330 / 400 · 82.5%</text><text x="584" y="93" fill="#b9d3ec" font-size="13">3.488 score · identical in the 3 runs</text><text x="25" y="132" fill="#e5f3ff" font-size="17" font-weight="700">Colab CPU · 1 thread · 3 × 60 s</text><text x="25" y="154" fill="#a8bfdc" font-size="13">Official harness, latency of predict</text><text x="584" y="133" fill="#fff" font-size="18" font-weight="700">0.140 ms per sample</text><text x="584" y="155" fill="#b9d3ec" font-size="13">≈ 428,000 answers / 60 s · estimated score ≈ 120</text><text x="25" y="194" fill="#e5f3ff" font-size="17" font-weight="700">Offline teacher (not submitted)</text><text x="25" y="216" fill="#a8bfdc" font-size="13">InceptionTime, 5 folds × 5 seeds, trained on Kaggle</text><text x="584" y="195" fill="#fff" font-size="18" font-weight="700">89.0% on test_demo</text><text x="584" y="217" fill="#b9d3ec" font-size="13">~500× slower: used only to label training data</text>
